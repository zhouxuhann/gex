# GEX Monitor 配置文件

ib:
  host: "127.0.0.1"           # Docker 内用 "host.docker.internal"
  port: 4002                   # IB Gateway Live 端口 (Paper: 7497)
  client_id_base: 10           # 每个标的递增 client_id
  connect_timeout: 20
  request_timeout: 8           # qualify/历史/快照等同步请求硬超时

symbols:
  - name: QQQ
    trading_class: QQQ
    strike_range: 0.04         # ATM 上下 4%
    enabled: true

  - name: SPY
    trading_class: SPY
    strike_range: 0.04
    enabled: true

  - name: SPX
    trading_class: SPXW        # SPX 周权
    strike_range: 0.03
    sec_type: IND              # 指数
    extended_hours: true       # Cboe GTH/Curb：20:15-9:25 / 16:15-17:00 ET
    enabled: false             # 默认关闭

  # 个股周期权
  - name: NVDA
    trading_class: NVDA        # NVDA 周权
    strike_range: 0.05         # ATM 上下 5%
    enabled: false

  - name: AMD
    trading_class: AMD         # AMD 周权
    strike_range: 0.05
    enabled: false

  - name: MRVL
    trading_class: MRVL        # MRVL 周权
    strike_range: 0.06         # 价格较低，范围稍大
    enabled: false

storage:
  # 相对路径由程序固定按项目根目录解析，不再依赖启动 cwd；Docker 用 "/data"
  data_dir: "./data"
  max_history: 8000            # 内存中保留的历史条数

server:
  host: "0.0.0.0"
  port: 8050

monitoring:
  stale_seconds: 15            # 数据陈旧警告阈值
  reconnect_stale_seconds: 60
  hard_stall_restart_seconds: 120
  hard_stall_check_seconds: 15
  spot_sanity_pct: 0.01        # spot 单 tick 最大漂移 (1%)
  # QQQ + SPY 合计最多 80 条流式期权行情，为其他请求预留 IB 行情额度。
  max_option_contracts_per_symbol: 40
  quality_min_contracts: 20    # 每个快照至少需要的有效期权合约数
  tail_degraded_failure_threshold: 3  # 尾盘完整链连续失败后才缩窄订阅
  tail_degraded_probe_seconds: 60     # 窄窗期间恢复完整链的探测间隔
  quality_max_missing_ratio: 0.25
  quality_min_rth_coverage: 0.95
  quality_max_gap_seconds: 60
  quality_max_derived_null_ratio: 0.10

# 0DTE ATM straddle 观测器与受模拟账户硬锁保护的 Paper 策略。
intraday_vrp:
  enabled: true
  observation_only: true
  symbols: [QQQ, SPY]
  schedule_et: ["09:35", "10:00", "10:30", "11:00", "12:00", "13:00", "14:00", "14:30", "15:00"]
  # 1分钟原始节点；统计锥使用5分钟标准节点。
  minute_nodes_enabled: true
  minute_node_start_et: "09:35"
  minute_node_end_et: "15:55"
  cone_interval_minutes: 5
  sample_window_seconds: 180
  candidate_strikes_each_side: 2
  wing_strikes_each_side: 5
  iron_fly_widths: [1, 2, 3, 5]
  max_quote_age_seconds: 10
  max_combined_spread_ratio: 0.10
  commission_per_straddle: 1.30
  mtm_checkpoints_minutes: [5, 15, 30, 60]
  mtm_interval_minutes: 5
  mtm_fixed_times_et: ["15:30"]
  vix_cache_seconds: 300
  # 每个 VRP 时点按总方差插值的标准化 ATM IV 期限节点。
  standardized_iv_dtes: [1, 2, 5]
  # 多到期日请求较重，每15分钟刷新；中间5分钟节点复用并保留asof。
  term_structure_cache_seconds: 900
  # 15:30 多期限 skew 最多占用 worker 45 秒，超时保留已完成期限。
  skew_surface_budget_seconds: 45
  # Paper-only experiments. Hard-blocked unless IB port=4002 and account starts DU.
  paper_execution_enabled: true
  paper_straddle_execution_enabled: true
  paper_required_port: 4002
  paper_entry_slots: ["10:00", "14:00"]
  paper_iron_fly_width: 3
  paper_quantity: 1
  paper_order_timeout_seconds: 30
  paper_quote_refresh_seconds: 2.0

# 日内转折点实时影子评分：只观察、只落盘，代码中没有下单接口。
intraday_turning_point_shadow:
  enabled: true
  observation_only: true
  symbols: [QQQ, SPY]
  model_path: "config/turning_point_shadow_v1.json"
  lookback_minutes: 60
  cooldown_minutes: 15
  max_candidate_lag_seconds: 90
  latest_candidate_time_et: "15:44"
  gex_tolerance_seconds: 120
  strike_tolerance_seconds: 120

alerts:
  ib_errors:
    email:
      enabled: true
      sender: "fzhouxu615@gmail.com"
      password_env: "GMAIL_APP_PASSWORD"
      recipients:
        - "wenyi.hann@gmail.com"
      subject_prefix: "[GEX-IB]"
      cooldown_sec: 600          # 同一 IB error 10 分钟最多提醒一次

timing:
  tick_interval_sec: 3         # 主循环间隔（秒）
  persist_interval_sec: 60     # 持久化间隔（秒）
  reconnect_delay_sec: 10      # IB 重连等待（秒）
  market_closed_check_sec: 300 # 非交易时段检查间隔（秒）
  max_sleep_sec: 1800          # 非交易时段最长休眠（秒）

database:
  enabled: true
  host: "127.0.0.1"
  port: 5433
  dbname: "ibkr_market_data"
  user: "ibkr_user"
  connect_timeout: 5
  statement_timeout_ms: 5000
  lock_timeout_ms: 2000
